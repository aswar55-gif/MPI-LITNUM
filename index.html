<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MPI Litnum Kelas 5 – Petualangan Kebun Sekolah</title>
<style>
:root{--bg:#FFF9E6;--card:#FFFFFF;--ink:#1F2937;--mute:#6B7280;--g:#0B5D4B;--g2:#D9F2E6;--y:#F2B632;--r:#E5484D;--ok:#16A34A;--line:#E5E7EB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10231D;--card:#1A3329;--ink:#F3F4F6;--mute:#A7B5AE;--g:#7EE0B8;--g2:#24493B;--line:#2F5446}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Nunito","Trebuchet MS",Arial,sans-serif;font-size:18px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
header .logo{font-size:40px}
header h1{font-size:22px;margin:0;color:var(--g)}
header p{margin:0;color:var(--mute);font-size:14px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;width:0;background:var(--y);border-radius:99px;transition:width .4s}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:16px}
.tag{display:inline-block;background:var(--g2);color:var(--g);font-weight:700;border-radius:99px;padding:2px 14px;font-size:14px;margin-bottom:8px}
h2{margin:4px 0 10px;font-size:24px;color:var(--g)}
.btn{background:var(--g);color:#fff;border:0;border-radius:14px;padding:12px 24px;font:inherit;font-weight:700;cursor:pointer}
:root[data-theme="dark"] .btn{color:#10231D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#10231D}}
.btn:hover{filter:brightness(1.1)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--y)}
.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.15)}
.opt.no{border-color:var(--r);background:rgba(229,72,77,.15)}
.fb{margin-top:10px;padding:12px 16px;border-radius:14px;background:var(--g2);display:none}
.passage{border-left:0;background:var(--g2);border-radius:14px;padding:14px 18px}
.chart{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.row{display:grid;grid-template-columns:90px 1fr 60px;align-items:center;gap:8px;font-size:16px}
.row b{display:block;height:26px;border-radius:8px;background:var(--g);width:0;transition:width .8s}
.row:nth-child(2) b{background:#E5484D}.row:nth-child(3) b{background:var(--y)}.row:nth-child(4) b{background:#8B5CF6}
.stars{font-size:44px;letter-spacing:6px}
.center{text-align:center}
.hint{color:var(--mute);font-size:15px}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">🌱</div><div><h1>Petualangan Kebun Sekolah</h1><p>MPI Literasi dan Numerasi – Kelas 5 SD</p></div></header>
<div class="bar" aria-hidden="true"><i id="pb"></i></div>
<main id="app"></main>
</div>
<script>
var TEXT = [
 "Setiap Sabtu pagi, murid kelas 5 SDN 630 Wara merawat kebun sekolah. Mereka menyiram tanaman, mencabut rumput, dan memberi pupuk kompos yang dibuat dari daun kering.",
 "Bu Sari, wali kelas mereka, selalu berpesan, “Kebun yang dirawat dengan sabar akan memberi hasil yang banyak.” Setelah dua bulan, tibalah hari panen.",
 "Sebagian hasil kebun dimasak untuk makan bersama, dan sebagian dijual untuk membeli bibit baru. Murid-murid bangga karena kerja keras mereka membuahkan hasil."
];
var DATA = [["Kangkung",12],["Tomat",8],["Cabai",4],["Terong",16]];
var Q = [
 {m:1,q:"Apa ide pokok bacaan di atas?",o:["Cara membuat pupuk kompos","Murid kelas 5 merawat kebun sekolah sampai panen","Harga sayur di pasar","Pesan Bu Sari tentang kebersihan"],a:1,e:"Ide pokok adalah gagasan utama: seluruh bacaan bercerita tentang merawat kebun hingga panen."},
 {m:1,q:"Pupuk kompos yang dipakai murid dibuat dari apa?",o:["Kotoran hewan","Daun kering","Sisa makanan","Abu dapur"],a:1,e:"Kalimat pertama menyebut: pupuk kompos dibuat dari daun kering."},
 {m:1,q:"Mengapa sebagian hasil kebun dijual?",o:["Supaya kebun cepat kosong","Untuk membeli bibit baru","Karena murid tidak suka sayur","Agar Bu Sari mendapat uang"],a:1,e:"Bacaan menyatakan hasil dijual untuk membeli bibit baru agar kebun terus berlanjut."},
 {m:1,q:"Pesan Bu Sari mengajarkan kita untuk bersikap …",o:["Cepat menyerah","Sabar dan tekun","Suka bersaing","Boros"],a:1,e:"“Dirawat dengan sabar” berarti kita perlu sabar dan tekun agar berhasil."},
 {m:2,q:"Berapa kilogram (kg) total hasil panen kebun?",o:["36 kg","38 kg","40 kg","42 kg"],a:2,e:"12 + 8 + 4 + 16 = 40 kg."},
 {m:2,q:"Terong yang dipanen 16 kg. Berapa bagian terong dari seluruh panen?",o:["1/4","2/5","1/2","3/5"],a:1,e:"16/40 disederhanakan (dibagi 8) menjadi 2/5."},
 {m:2,q:"Semua cabai (4 kg) dijual dengan harga Rp40.000 per kg. Berapa uang yang diperoleh?",o:["Rp120.000","Rp140.000","Rp160.000","Rp180.000"],a:2,e:"4 × Rp40.000 = Rp160.000."},
 {m:2,q:"Tomat yang dipanen 8 kg dari 40 kg total. Berapa persen hasil tomat?",o:["8%","10%","20%","25%"],a:2,e:"8/40 = 20/100 = 20%."}
];
var i=-1, score=0, app=document.getElementById('app'), pb=document.getElementById('pb');
function el(h){return h}
function intro(){
 pb.style.width='0';
 app.innerHTML='<div class="card center"><div style="font-size:64px">🧑‍🌾📖🔢</div><h2>Halo, Petani Cilik!</h2><p>Yuk, bantu murid kelas 5 memanen hasil kebun. Ada dua misi:</p><p><b>Misi 1 – Membaca</b> (4 soal)<br><b>Misi 2 – Berhitung</b> (4 soal)</p><p class="hint">Kumpulkan bintang sebanyak mungkin!</p><button class="btn" onclick="next()">Mulai Petualangan ▶</button></div>';
}
function passage(){return '<div class="card"><span class="tag">📖 Teks Bacaan</span><h2>Kebun Sekolah Kami</h2><div class="passage">'+TEXT.map(function(t){return '<p>'+t+'</p>'}).join('')+'</div></div>'}
function chart(){
 var max=16;
 return '<div class="card"><span class="tag">📊 Data Hasil Panen (kg)</span><div class="chart">'+DATA.map(function(d){return '<div class="row"><span>'+d[0]+'</span><b data-w="'+(d[1]/max*100)+'"></b><span><strong>'+d[1]+' kg</strong></span></div>'}).join('')+'</div></div>';
}
function show(){
 var q=Q[i], first=(i===0||i===4), h='';
 pb.style.width=(i/Q.length*100)+'%';
 if(first){h+='<div class="card center"><div style="font-size:48px">'+(q.m===1?'📖':'🧮')+'</div><h2>Misi '+q.m+': '+(q.m===1?'Membaca':'Berhitung')+'</h2></div>'}
 h+=(q.m===1?passage():chart());
 h+='<div class="card"><span class="tag">Soal '+(i+1)+' dari '+Q.length+'</span><h2>'+q.q+'</h2><div id="opts">'+q.o.map(function(t,k){return '<button class="opt" data-k="'+k+'">'+String.fromCharCode(65+k)+'. '+t+'</button>'}).join('')+'</div><div class="fb" id="fb"></div><p class="center"><button class="btn" id="nx" style="display:none" onclick="next()">'+(i===Q.length-1?'Lihat Hasil 🏆':'Lanjut ▶')+'</button></p></div>';
 app.innerHTML=h;
 setTimeout(function(){var bs=document.querySelectorAll('.row b');for(var j=0;j<bs.length;j++)bs[j].style.width=bs[j].getAttribute('data-w')+'%'},50);
 var bt=document.querySelectorAll('.opt');
 for(var j=0;j<bt.length;j++)bt[j].onclick=function(){answer(+this.getAttribute('data-k'))};
 window.scrollTo(0,0);
}
function answer(k){
 var q=Q[i], bt=document.querySelectorAll('.opt'), fb=document.getElementById('fb');
 for(var j=0;j<bt.length;j++)bt[j].disabled=true;
 bt[q.a].classList.add('ok');
 if(k===q.a){score++;fb.innerHTML='🎉 <b>Hebat, benar!</b> '+q.e}
 else{bt[k].classList.add('no');fb.innerHTML='💡 <b>Belum tepat.</b> '+q.e}
 fb.style.display='block';document.getElementById('nx').style.display='inline-block';
 fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function result(){
 pb.style.width='100%';
 var st=score>=7?3:score>=5?2:1, b=score>=7?'Petani Super 🌟':score>=5?'Petani Hebat 🌿':'Petani Pemula 🌱';
 var s='';for(var j=0;j<3;j++)s+=(j<st?'⭐':'☆');
 app.innerHTML='<div class="card center"><h2>Panen Selesai!</h2><div class="stars">'+s+'</div><p style="font-size:28px;margin:6px 0"><b>'+score+' / '+Q.length+'</b></p><p>Lencana kamu: <b>'+b+'</b></p><p class="hint">'+(st===3?'Luar biasa! Literasi dan numerasimu sudah mantap.':'Ayo coba lagi untuk mengumpulkan lebih banyak bintang!')+'</p><button class="btn" onclick="restart()">Main Lagi 🔄</button></div>';
}
function next(){i++;if(i>=Q.length)result();else show()}
function restart(){i=-1;score=0;intro()}
intro();
</script>
</body>
</html>
